# Oracle Cloud Always Free (Ampere A1, Ubuntu 22.04/24.04 aarch64)
# Caddy terminates TLS with an automatic Let's Encrypt cert for $DEMO_HOST.
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      BRAIN: heuristic          # local rules only - no model, no key, no network
      MAX_SECONDS: "60"
      MIN_SECONDS: "5"
      MAX_UPLOAD_MB: "80"
      PER_IP_PER_HOUR: "3"
      GLOBAL_PER_DAY: "60"
      QUEUE_MAX: "4"
      RETENTION_MIN: "30"
      TRUST_PROXY: "1"          # Caddy is the only thing that can reach the app
      ALLOWED_ORIGINS: "https://evanderpool.github.io"
    tmpfs:
      - /tmp:size=4g            # job files live in RAM-backed tmpfs: gone on restart, never touch disk
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 6g
    cpus: 3
    expose: ["7860"]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DEMO_HOST: ${DEMO_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

volumes:
  caddy_data:
